<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velary - Cadastro</title>
    <link rel="stylesheet" href="home.css">
</head>
<body style="background-color: #fff9fa; margin: 0; font-family: sans-serif;">

    <header>
        <a href="home.html">
            <img src="https://github.com/user-attachments/assets/430aff38-7e6b-4f70-b4de-b6e8bf20b5bc" alt="Velary Logo" class="header-logo">
        </a>
        <nav>
            <a href="home.html" style="color: #d15b7d; font-weight: bold; text-decoration: none;">Voltar para Início</a>
        </nav>
    </header>

    <section style="padding: 100px 20px 60px 20px; display: flex; justify-content: center;">
        <div style="background: white; padding: 40px; border-radius: 25px; box-shadow: 0 10px 30px rgba(209,91,125,0.1); width: 100%; max-width: 450px; border: 1px solid #fce3ec; text-align: center;">
            <h2 style="color: #d15b7d; margin-bottom: 10px;">Faça parte do Velary</h2>
            <p style="color: #888; margin-bottom: 25px; font-size: 0.95rem;">Cadastre-se para uma experiência personalizada.</p>
            
            <form id="formCadastro">
                <input type="text" id="nome" placeholder="Seu Nome Completo" required style="width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 10px; border: 1px solid #FCC1D6; outline: none; box-sizing: border-box;">
                
                <input type="email" id="email" placeholder="Seu E-mail" required style="width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 10px; border: 1px solid #FCC1D6; outline: none; box-sizing: border-box;">
                
                <div style="text-align: left; margin-bottom: 15px;">
                    <label for="nascimento" style="font-size: 0.85rem; color: #666; display: block; margin-bottom: 5px; padding-left: 5px;">Data de Nascimento:</label>
                    <input type="date" id="nascimento" required style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #FCC1D6; outline: none; box-sizing: border-box; color: #666;">
                </div>

                <div style="text-align: left; margin-bottom: 15px;">
                    <label for="interesse" style="font-size: 0.85rem; color: #666; display: block; margin-bottom: 5px; padding-left: 5px;">Qual o seu principal foco de cuidado?</label>
                    <select id="interesse" required style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #FCC1D6; outline: none; box-sizing: border-box; color: #666; background: white;">
                        <option value="" disabled selected>Selecione uma opção...</option>
                        <option value="Primeiro Ciclo">Primeiro Ciclo (Menarca / Adolescência)</option>
                        <option value="Saúde Integral">Saúde Integral (Ciclos / Rotina)</option>
                        <option value="Maturidade">Plenitude &amp; Maturidade (Climatério / Menopausa)</option>
                    </select>
                </div>

                <input type="password" id="senha" placeholder="Crie uma Senha" required style="width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 10px; border: 1px solid #FCC1D6; outline: none; box-sizing: border-box;">

                <button type="submit" style="width: 100%; background-color: #d15b7d; color: white; padding: 14px; border: none; border-radius: 20px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: background 0.3s;">
                    Criar Conta
                </button>
            </form>

            <p style="margin-top: 20px; font-size: 0.85rem; color: #777;">
                Já tem uma conta? <a href="#" style="color: #d15b7d; font-weight: bold; text-decoration: none;">Entrar</a>
            </p>
        </div>
    </section>

    <script>
        document.getElementById('formCadastro').onsubmit = function(e) {
            e.preventDefault();
            const usuario = {
                nome: document.getElementById('nome').value,
                email: document.getElementById('email').value,
                nascimento: document.getElementById('nascimento').value,
                foco: document.getElementById('interesse').value
            };
            
            // Salva os dados de perfil no localStorage
            localStorage.setItem('velary_usuario', JSON.stringify(usuario));
            alert('Cadastro realizado com sucesso!');
            window.location.href = 'home.html';
        };
    </script>
</body>
</html>
